<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yapılacaklar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Yapılacaklar</title>
<style>
  :root{
    --bg:#f3f5f7; --card:#ffffff; --text:#1f2328; --muted:#6b737c;
    --line:#e3e7eb; --accent:#0398dc; --hover:#f1f4f7; --onaccent:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101214; --card:#1b1e21; --text:#e4e7ea; --muted:#9aa1a8;
           --line:#2c3035; --accent:#29b2f0; --hover:#24282c; --onaccent:#0b1620;
           color-scheme:dark; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
       padding-top:calc(24px + env(safe-area-inset-top, 0px));
       padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
       padding-left:max(16px, env(safe-area-inset-left, 0px));
       padding-right:max(16px, env(safe-area-inset-right, 0px));}
  .card{max-width:520px;margin:0 auto;background:var(--card);border-radius:12px;
        box-shadow:0 1px 3px rgba(0,0,0,.12);overflow:hidden}
  h1{font-size:22px;font-weight:400;margin:0;padding:20px 16px 8px}
  .add{display:flex;align-items:center;gap:8px;padding:8px 16px 12px}
  .add input{flex:1;min-width:0;border:none;border-bottom:1px solid var(--line);background:transparent;
             color:var(--text);font-size:16px;padding:10px 2px;outline:none;font-family:inherit}
  .add input:focus{border-bottom-color:var(--accent)}
  .add button{border:none;background:var(--accent);color:var(--onaccent);border-radius:50%;
              width:38px;height:38px;font-size:22px;line-height:1;cursor:pointer;flex:none}
  .head{display:flex;justify-content:space-between;align-items:center;
        padding:14px 16px 4px;color:var(--muted);font-size:13px;font-weight:500;
        letter-spacing:.04em;text-transform:uppercase}
  .head button{border:none;background:none;color:var(--accent);font-size:13px;cursor:pointer;
               text-transform:none;letter-spacing:0;font-family:inherit}
  ul{list-style:none;margin:0;padding:0 0 8px}
  li{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:50px}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;flex:none;margin:0}
  .txt{flex:1;min-width:0;font-size:16px;word-break:break-word}
  li.done .txt{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
  .del{border:none;background:none;color:var(--muted);font-size:22px;cursor:pointer;
       opacity:.6;padding:4px 6px;flex:none}
  .empty{color:var(--muted);padding:6px 16px 14px;font-size:14px}
  hr{border:none;border-top:1px solid var(--line);margin:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
  <h1>Yapılacaklar</h1>
  <form class="add" id="f">
    <input id="yeni" placeholder="Öğe ekle" autocomplete="off" enterkeyhint="done">
    <button type="submit" aria-label="Ekle">+</button>
  </form>
  <hr>
  <div class="head"><span>Yapılacak</span></div>
  <ul id="aktif"></ul>
  <hr>
  <div class="head"><span>Tamamlandı</span><button id="temizle" type="button">Tamamlananları sil</button></div>
  <ul id="biten"></ul>
</div>
<script>
  const KEY = "yapilacaklar-v1";
  let items = [];
  try { const l = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(l)) items = l; } catch(e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e) {} };

  function render(){
    const a = document.getElementById("aktif"), b = document.getElementById("biten");
    a.innerHTML = ""; b.innerHTML = "";
    const aktif = items.filter(i => !i.done), biten = items.filter(i => i.done).sort((x,y)=>y.t-x.t);
    for (const it of [...aktif, ...biten]) {
      const li = document.createElement("li");
      if (it.done) li.className = "done";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = it.done;
      cb.onchange = () => { it.done = cb.checked; it.t = Date.now(); save(); render(); };
      const s = document.createElement("span");
      s.className = "txt"; s.textContent = it.text;
      const d = document.createElement("button");
      d.className = "del"; d.textContent = "×"; d.type = "button";
      d.onclick = () => { items = items.filter(x => x !== it); save(); render(); };
      li.append(cb, s, d);
      (it.done ? b : a).appendChild(li);
    }
    if (!aktif.length) a.innerHTML = '<div class="empty">Yapılacak bir şey yok</div>';
    if (!biten.length) b.innerHTML = '<div class="empty">Henüz tamamlanan yok</div>';
    document.getElementById("temizle").hidden = !biten.length;
  }

  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    const inp = document.getElementById("yeni"), v = inp.value.trim();
    if (!v) return;
    items.unshift({ text: v, done: false, t: Date.now() });
    inp.value = ""; save(); render();
  };
  document.getElementById("temizle").onclick = () => {
    items = items.filter(i => !i.done); save(); render();
  };
  render();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
